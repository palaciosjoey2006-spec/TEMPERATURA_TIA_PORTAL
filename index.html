<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control IoT - Sensores Dallas Dobles</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e1e1e; padding: 2rem; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 340px; }
    .temp-box { background: #2a2a2a; padding: 10px; border-radius: 8px; margin: 10px 0; }
    .temp-val { font-size: 1.5rem; font-weight: bold; color: #00d2ff; }
    .prom-val { font-size: 2rem; font-weight: bold; color: #00c853; }
    select { width: 100%; padding: 10px; font-size: 1rem; border-radius: 8px; background: #333; color: #fff; border: 1px solid #555; margin-bottom: 15px; }
    button { padding: 10px 20px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; margin: 5px; font-weight: bold; width: 45%; }
    .btn-on { background: #00c853; color: #fff; }
    .btn-off { background: #d50000; color: #fff; }
    .status { font-size: 0.85rem; color: #aaa; margin-top: 1rem; }
    .disabled { opacity: 0.4; pointer-events: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>Control Múltiple Dallas</h2>
  
  <div class="temp-box">
    <div>Sensor 1</div>
    <div class="temp-val" id="temp1">-- °C</div>
  </div>

  <div class="temp-box">
    <div>Sensor 2</div>
    <div class="temp-val" id="temp2">-- °C</div>
  </div>

  <div class="temp-box" style="border: 2px solid #00c853;">
    <div>Promedio</div>
    <div class="prom-val" id="promedio">-- °C</div>
  </div>

  <label for="modoSelect"><strong>Modo de Operación:</strong></label>
  <select id="modoSelect" onchange="cambiarModo()">
    <option value="MANUAL">Manual</option>
    <option value="AUTO">Automático (> 25°C)</option>
  </select>

  <div id="panelManual">
    <button class="btn-on" onclick="controlarLed('ON')">Encender</button>
    <button class="btn-off" onclick="controlarLed('OFF')">Apagar</button>
  </div>
  
  <div class="status" id="estado">Conectando al servidor...</div>
</div>

<script>
  // TOPICS MQTT
  const t1Topic = "mi_proyecto_unico_99/temp1";
  const t2Topic = "mi_proyecto_unico_99/temp2";
  const promTopic = "mi_proyecto_unico_99/promedio";
  const ledTopic = "mi_proyecto_unico_99/led";
  const modoTopic = "mi_proyecto_unico_99/modo";

  const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

  client.on("connect", () => {
    document.getElementById("estado").innerText = "Conectado en línea";
    client.subscribe(t1Topic);
    client.subscribe(t2Topic);
    client.subscribe(promTopic);
  });

  client.on("message", (topic, message) => {
    if (topic === t1Topic) {
      document.getElementById("temp1").innerText = message.toString() + " °C";
    } else if (topic === t2Topic) {
      document.getElementById("temp2").innerText = message.toString() + " °C";
    } else if (topic === promTopic) {
      document.getElementById("promedio").innerText = message.toString() + " °C";
    }
  });

  function cambiarModo() {
    const modo = document.getElementById("modoSelect").value;
    client.publish(modoTopic, modo);

    // Deshabilita los botones manuales en la web si está en automático
    const panelManual = document.getElementById("panelManual");
    if (modo === "AUTO") {
      panelManual.classList.add("disabled");
    } else {
      panelManual.classList.remove("disabled");
    }
  }

  function controlarLed(accion) {
    client.publish(ledTopic, accion);
  }
</script>

</body>
</html>
